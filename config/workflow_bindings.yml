        path: /tools/legal-period
        why: 「청구받은 날부터 5일 이내」 지급 기한을 실제 날짜로 센다.
    forms:
      - label: 대금청구서
        path: /templates/5
        why: 지급 청구 서식.
    topics:
      - label: 대금 지급
        path: /topics/payment
        why: 지급 기한·지연이자 근거.
    audit_cases:
      - label: 검수 전에 지급한 사례
        path: /audit-cases/payment-before-inspection
        why: 이 단계의 대표 지적.

  # ── 용역 ────────────────────────────────────────────────────────────────
