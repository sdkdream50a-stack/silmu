    # 도구 없음 — 납품 단계를 판정하는 도구는 SILMU 에 없다. 만들어진 척 링크하지 않는다.
    forms:
      - label: 물품 납품확인서
        path: /templates/4
        why: 납품 완료 확인 서식.

