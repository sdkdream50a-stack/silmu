# 계약 판단 규칙 — 수의계약 가능성 · 견적요건 · 분할발주 위험
#
# 이 파일이 R2 판단의 유일한 규칙 원천이다. 코드에 임계값을 두지 않는다.
# 모든 rule 은 authority_source + source_locator 를 가져야 하며,
# 근거 없는 rule 은 RuleSet 로딩 단계에서 거부된다(ContractDecision::RuleSet).
#
# ⚠️ 여기 있는 금액·기간은 전부 조문에서 옮겨 적은 것이다. "사용자 편의를 위한" 임계값을
#    추가하지 않는다. 근거가 없으면 UNKNOWN / REVIEW_REQUIRED 로 남긴다.

meta:
  version: "2026-09-06"
  compiled_from: "법제처 국가법령정보 공동활용 API (open.law.go.kr)"
  # 판정에 쓰이는 rule 은 아래 9개 field 를 모두 가져야 한다.
  # 하나라도 없으면 RuleSet 로딩이 실패한다(fail-closed) — 근거 없는 편의 rule 을 만들지 않기 위해서다.
  required_rule_fields:
    - rule_id
    - title
    - agency_scope
    - contract_types
    - condition
    - outcome
    - authority_source
    - source_locator
    - effective_from
    - verified_at
  # 조문 재대조 기록 = docs/silmu-p2/r2/_data/articles_verified.json
  articles_verified_at: "2026-09-06T05:13:32Z"

sources:
  LOCAL_CONTRACT_ACT:
    title: "지방자치단체를 당사자로 하는 계약에 관한 법률"
