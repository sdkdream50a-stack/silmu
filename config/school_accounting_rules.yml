# 시·도 교육규칙 — 학교회계 기한 레지스트리 (17개 교육청 전수)
#
# 이 파일은 손으로 옮겨 적은 것이 아니다. 법제처 국가법령정보 공동활용 API 의 **자치법규**
# (`target=ordin`, MST=자치법규일련번호)에서 17개 규칙 전문을 내려받아 조문에서 기계 추출했다.
# 수집·추출 절차와 원본 XML = multi-agent-harness tasks/silmu-school-accounting-calendar-p3-0920/sources/
# 수집일 2026-09-20.
#
# ⚠️ 규칙 명칭은 통일돼 있지 않다(「공립학교회계 규칙」·「공립 유치원 및 학교 회계 규칙」·
#    「전라남도립학교 회계 규칙」·「대구광역시립학교 회계 규칙」·「공립학교 회계규칙」).
#    이름 템플릿으로는 수집할 수 없어 범위 검색(query="학교 회계")으로 17건을 회수했다.
#
# closing_type — **전국 공통이 아니다**(11:6).
#   after_end_20_days      : 「회계연도 종료 후 20일이 되는 날에 폐쇄」
#   year_end_with_exception: 「회계연도가 끝나는 날 폐쇄」 + 단서(지방회계법 §7① 등)로
#                            다음 회계연도 3월 20일까지 열거된 예외만 처리
#   두 유형은 폐쇄 시점 자체가 다르다. 하나로 합치면 6개 교육청에 거짓이 된다.
#
# 값이 비어 있으면 «그 규칙에 해당 조항이 없다» 는 실측값이다(모름이 아니다).
# 전남은 개별통지 7일·결산심의 3개월 조항이 규칙에 없고 지침 층에서 정한다.
# ── P4 (2026-09-20) — SOURCE NORMALIZATION ─────────────────────────────────────
# 이 파일은 «일회성 수집 결과» 가 아니라 **갱신 가능한 등록부**다.
# 층(layer)·출처 종류·관할은 여기서 선언하고, «언제 받았나·해시·이전 판본» 같은
# 시점 정보는 여기 적지 않는다 — 그건 `authority_*` 테이블(기존 freshness engine)이 소유한다.
# 같은 사실을 두 곳에서 유지하면 반드시 갈린다. 조인은 `SchoolAccountingSources` 가 한다.
#
# layer — §9 의 3층. 다수결을 전국 규칙으로 올리는 것을 **구조적으로** 막는다.
#   NATIONAL_CORE    : 법률. 전국 공통이므로 그대로 기한으로 쓴다
#   REGIONAL_RULE    : 시·도 교육규칙. 17/17·16/17 일 때만 기한, 갈리면 «갈린다» 고 적는다
#   ANNUAL_GUIDELINE : 교육감 예산편성 기본지침. **기한으로 쓰지 않는다**(대조용)
