# P1-5 §18 — 도구 신뢰 메타데이터.
#
# 각 도구가 "무엇을 기준으로 계산하는가"를 화면에 표시하기 위한 등록부.
# ⚠️ 기준을 모르는 도구는 여기에 넣지 않는다. 없는 근거를 만들지 않는다.
#    등록되지 않은 도구는 공통 면책만 표시된다.
#
# standard: 기준값을 소유한 설정 파일 (버전은 그 파일에서 직접 읽는다 — 손으로 적지 않는다)
#   contract_thresholds → config/contract_thresholds.yml
#   legal_standards     → config/legal_standards.yml
# laws: 근거 법령명 (LegalReferenceResolver 허용목록과 대조되어 링크로 승격된다)

defaults:
  disclaimer: "계산 결과는 실무 참고용입니다. 소속 기관의 최신 지침·예규와 개별 상황에 따라 달라질 수 있으니, 기안 전 표시된 공식 근거를 확인하세요."

tools:
  contract-method:
    basis: "지방계약법령 계약방법 결정 기준"
    standard: contract_thresholds
    laws: "지방계약법 제9조, 지방계약법 시행령 제25조, 제30조"
  contract-guarantee:
    basis: "지방계약법령 계약보증금·지연배상금 기준"
    standard: contract_thresholds
    laws: "지방계약법 제15조, 지방계약법 시행령 제51조, 제53조, 제90조"
  estimated-price:
    basis: "지방계약법령 예정가격 결정 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제7조, 제8조, 제9조"
  predetermined-price:
    basis: "지방계약법령 복수예비가격 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제7조"
  split-contract-checker:
    basis: "지방계약법령 분할계약 금지 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제77조(공사)·제7조제2호(물품·용역 추정가격 합산)·행정안전부 예규 집행기준 제1장 제1절 5.라"
  contract-legality-check:
    basis: "지방계약법령 계약 적법성 점검 기준"
    standard: contract_thresholds
    laws: "지방계약법 제9조, 지방계약법 시행령 제25조"
  contract-documents:
    basis: "지방계약법령 계약서류 작성 기준"
    standard: contract_thresholds
    laws: "지방계약법 제14조, 지방계약법 시행령 제48조"
  contract-reason:
    basis: "지방계약법령 수의계약 사유 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제25조"
  qualification-evaluation:
    basis: "지방계약법령 적격심사 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제42조"
  budget-estimator:
    basis: "지방계약법령 추정가격 산정 기준"
    standard: contract_thresholds
    laws: "지방계약법 시행령 제7조"
    jurisdiction:
      applies_to: "지방계약법령 추정가격 산정 — 소규모 공사·용역 예산 추정"
      agency: "지방자치단체 · 국·공립학교(학교장이 체결하는 계약)"
      guideline: "「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제7조(추정가격의 산정)"
      standard_year: "UNVERIFIED"
      # 17개 시·도 학교회계 규칙이 모두 「지방자치단체를 당사자로 하는 계약에 관한 법률(시행령)」을
      # 직접 인용한다(2026-09-20 전수 대조). 그래서 «학교에는 다른 법» 이 아니다 — 다만 공개 기준
      # 금액처럼 교육규칙이 따로 정하는 축이 있다(예: 부산 규칙 제49조 수의계약 내역 100만원 이상 공개).
      school_differs: "학교 계약에도 같은 지방계약법령이 적용됩니다. 다만 수의계약 내역 공개 기준 금액 등 일부 절차는 시·도 교육규칙이 따로 정하므로 소속 교육청 규칙을 함께 확인하세요."
      school_path: "/school-office"
      school_path_label: "학교 행정실 바로가기"
  # ── 급여·복무 도구 3종 (P1-5 · G-24) ──────────────────────────────────────
  # 교육행정직은 **지방공무원**이라 국가 규정만 인용하면 근거가 반쪽이다. 국가·지방을 병기한다.
  # 조문은 artifacts/03a_TOOL_AUDIT_PAY_TRAVEL.md 에서 **원문 대조로 확인된 것만** 적었다.
  # `standard:` 는 일부러 비워 뒀다 — 이 세 도구의 기준값(봉급표·별표)은 config 파일이 아니라
  #   뷰 안에 있어서, 없는 «기준값 파일 버전»을 표시하면 거짓 기준일이 된다.
  overtime-calculator:
    basis: "시간외·야간·휴일근무수당 지급 기준 (기준호봉 봉급액 기준)"
    laws: "공무원수당 등에 관한 규정 제15조, 제16조, 제17조, 지방공무원 수당 등에 관한 규정 제15조"
  annual-leave-calculator:
    basis: "재직기간별 연가 일수 및 연도 중 임용자 비례 부여 기준"
    laws: "국가공무원 복무규정 제15조, 제17조, 지방공무원 복무규정 제7조"
  allowance-calculator:
    basis: "정근수당·명절휴가비·직급보조비 등 수당 지급 기준"
    laws: "공무원수당 등에 관한 규정 제7조, 지방공무원 수당 등에 관한 규정 제7조"

  travel-calculator:
    basis: "공무원 여비 지급 기준"
    standard: legal_standards
    # 「지방공무원 여비 규정」은 **존재하지 않는 법령명**이다(2026-09-17 law.go.kr 실측 — 검색
    # "지방공무원여비규정"·"지방공무원 여비 규정" 모두 lsiSeq 없는 오류페이지). 지방공무원의
    # 여비는 각 지자체 조례가 정한다. 대체 명칭을 만들지 않고 삭제한다(G-34 · P1-7).
    laws: "공무원 여비 규정"

  # ── 예산 도구 3종: 적용기관 고지 (P0-2 · LECTURE_READINESS_AUDIT R1)
  #
  # 이 세 도구는 **지방자치단체** 기준으로 만들어졌다. 학교(교육행정) 사용자가
  # 학교회계 기준으로 오해하면 과목·회계연도·심의절차가 전부 틀린다.
  # jurisdiction 블록은 그 사실을 계산 **전에** 화면에 세운다(shared/_jurisdiction_notice).
  #
  # ⚠️ standard_year 는 모르면 UNVERIFIED 로 둔다. 없는 기준연도를 만들지 않는다.
  #    학교회계 쪽 근거 체계(시도교육청 학교회계 규칙 등)는 원문 미확보라 이름을 단정하지 않는다.
  budget-category-finder:
    basis: "지방자치단체 세출예산 과목(목·세목) 분류"
    laws: "지방재정법"
    jurisdiction:
      applies_to: "지방자치단체 세출예산 편성목·통계목 분류"
      agency: "지방자치단체(일반회계·특별회계)"
      guideline: "지방재정법 제41조(예산의 과목 구분) · 행정안전부 「지방자치단체 예산편성 운영기준」·「지방자치단체 세출예산 집행기준」(매년 개정)"
      standard_year: UNVERIFIED
      school_differs: "학교회계는 세출 과목 체계가 다릅니다 — 이 도구가 추천하는 편성목(201·410~430 등)은 학교회계 과목이 아닙니다."
      school_path: "/topics/school-budget-compilation"
      school_path_label: "학교회계 예산편성 절차"
  budget-execution-rate:
    basis: "집행액 ÷ 예산액 (산식) — 지방자치단체 회계연도 1.1~12.31 가정"
    jurisdiction:
      applies_to: "세출예산 집행률 계산 · 균등 배분 참고선 대비 비교"
      agency: "지방자치단체(일반회계·특별회계)"
      guideline: "집행률 산식은 산술이며 법정 기준이 아닙니다. 지방재정법에는 분기·연도말 집행 목표율 규정이 없습니다(법령 전문 «집행률»·«목표율» 0건, 2026-09-18 대조)."
      standard_year: UNVERIFIED
      # ⚠️ 명령문("3월로 바꾸세요")으로 쓰지 않는다 — `/school-office` 에서 `?fy=3` 으로 들어오면
      #    이미 3월이라 그 지시가 거짓이 된다(2026-09-20 P0). 두 진입 경로 모두에서 참인 조건문으로 쓴다.
      school_differs: "학교회계 회계연도는 3월 1일~다음 해 2월 말일입니다 — 위 «회계연도 시작월»이 3월이어야 경과 월 수가 맞습니다."
      school_path: "/topics/school-budget-compilation"
      school_path_label: "학교회계 예산편성 절차"
  budget-transfer-checker:
    basis: "지방자치단체 예산 이월·전용 요건"
    laws: "지방재정법, 국가재정법"
    jurisdiction:
      applies_to: "세출예산 이월(명시·사고·계속비)·전용 요건 판단"
      agency: "지방자치단체(지방재정법) · 국가기관(국가재정법)"
      guideline: "지방재정법 제42조·제45조·제49조·제50조 · 국가재정법 제23조·제24조·제46조·제47조·제48조"
      standard_year: UNVERIFIED
      school_differs: "학교회계 이월·전용은 학교운영위원회 심의 등 절차가 달라 이 판단기의 «의회 심의» 요건이 그대로 적용되지 않습니다."
      school_path: "/topics/school-budget-compilation"
      school_path_label: "학교회계 예산편성 절차"

  # ── P3 (2026-09-20) — 예산 도구 6종 중 관할 미표기였던 2종 등록 ───────────────
  # `tools_helper` 의 domain: "예산" 은 6개인데 jurisdiction 이 붙은 것은 3개뿐이었다.
  # 그중 예비비 한도 계산기는 **학교 사용자에게 틀린 한도를 무표시로 보여 주고 있었다**.
  contingency-fund:
    basis: "지방재정법상 예비비 법정 한도(예산 총액의 1% 이내)"
    laws: "지방재정법 제43조"
    jurisdiction:
      applies_to: "지방자치단체 일반회계·교육비특별회계·그 밖의 특별회계의 예비비 한도 계산"
      agency: "지방자치단체(시·도교육청의 교육비특별회계 포함)"
      guideline: "지방재정법 제43조제1항 — 「지방자치단체는 … 일반회계와 교육비특별회계의 경우에는 각 예산 총액의 100분의 1 이내의 금액을 예비비로 예산에 계상하여야 하고」(법제처 원문 대조 2026-09-20)"
      standard_year: UNVERIFIED
      # 「교육비특별회계」는 시·도교육청의 회계이지 **학교회계가 아니다**. 학교회계 예비비의 근거는
      # 초·중등교육법 제30조의2제4항이고 비율 상한이 없다(「적절한 금액을 계상할 수 있다」).
      # 17개 시·도 학교회계 규칙 전수 대조에서도 비율 규정 0건 · 대신 「예비비는 업무추진비에
      # 지출할 수 없다」가 17/17 이다(2026-09-20).
      school_differs: "학교회계 예비비에는 이 1% 한도가 적용되지 않습니다. 「교육비특별회계」는 시·도교육청 회계이고 학교회계가 아닙니다 — 학교회계 예비비는 「초·중등교육법」 제30조의2제4항이 «적절한 금액을 계상할 수 있다» 로만 정해 비율 상한이 없고, 17개 시·도 교육규칙에도 비율 규정이 없습니다. 대신 17개 규칙 모두 예비비를 업무추진비에 지출하지 못하게 합니다."
      school_path: "/school-office/calendar"
      school_path_label: "학교회계 일정"

  subsidy-settlement-checker:
    basis: "보조금 정산 전 자가점검 — 감사 빈출 지적 기준"
    laws: "보조금 관리에 관한 법률, 지방재정법 제17조"
    jurisdiction:
      applies_to: "국고보조금·지방보조금 정산 전 자가점검"
      agency: "지방자치단체 · 국고/지방보조금 수령 기관"
      guideline: "보조금 관리에 관한 법률 · 지방재정법 제17조 · 지방보조금 관리기준"
      standard_year: UNVERIFIED
      # 학교회계도 「국가나 지방자치단체의 보조금 및 지원금」을 세입으로 받는다
      # (초·중등교육법 제30조의2제2항제4호 — 법제처 원문 대조 2026-09-20).
      # 다만 정산·반납 절차까지 이 체크리스트와 같은지는 **확인하지 않았다** → 단정하지 않는다.
      school_differs: "학교회계도 국가·지방자치단체 보조금을 세입으로 받습니다(초·중등교육법 제30조의2제2항제4호). 다만 정산·반납 절차는 교부기관이 정한 교부조건과 시·도 교육규칙이 함께 적용되므로, 이 체크리스트만으로 갈음하지 말고 교부 공문의 정산 조건을 확인하세요."
      school_path: "/school-office"
      school_path_label: "학교 행정실 바로가기"
