<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="logo_grad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#137fec"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#137fec" opacity="0.9"/>

  <!-- Shield logo -->
  <g transform="translate(80, 96) scale(0.62)">
    <path d="M100 20C60 20 40 45 40 45V140C40 165 70 180 100 180C130 180 160 165 160 140V45C160 45 140 20 100 20Z" fill="url(#logo_grad)"/>
    <path d="M85 70H115" stroke="white" stroke-linecap="round" stroke-opacity="0.9" stroke-width="8"/>
    <path d="M70 100H130" stroke="white" stroke-linecap="round" stroke-opacity="0.9" stroke-width="8"/>
    <path d="M85 130H115" stroke="white" stroke-linecap="round" stroke-opacity="0.9" stroke-width="8"/>
    <circle cx="100" cy="50" fill="white" fill-opacity="0.9" r="6"/>
  </g>
  <text x="204" y="150" font-family="Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">실무.kr</text>
  <text x="204" y="186" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" fill="#64748b">exam.silmu.kr</text>

  <!-- Eyebrow badge -->
  <rect x="80" y="248" width="290" height="48" rx="24" fill="#137fec" opacity="0.18"/>
  <text x="225" y="280" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">2026 신설 국가기술자격</text>

  <!-- Title -->
  <text x="80" y="392" font-family="Apple SD Gothic Neo, sans-serif" font-size="92" font-weight="800" fill="white">공공조달관리사</text>
  <text x="80" y="448" font-family="Apple SD Gothic Neo, sans-serif" font-size="32" fill="#94a3b8">이론·모의고사·실기 올인원 무료 시험대비</text>

  <!-- Stat chips -->
  <g font-family="Apple SD Gothic Neo, sans-serif">
    <rect x="80" y="492" width="232" height="56" rx="28" fill="#137fec" opacity="0.2"/>
    <text x="196" y="528" font-size="24" font-weight="700" fill="#93c5fd" text-anchor="middle">모의고사 1,010제</text>
    <rect x="328" y="492" width="220" height="56" rx="28" fill="#059669" opacity="0.2"/>
    <text x="438" y="528" font-size="24" font-weight="700" fill="#6ee7b7" text-anchor="middle">이론 4권 28장</text>
    <rect x="564" y="492" width="172" height="56" rx="28" fill="#f59e0b" opacity="0.2"/>
    <text x="650" y="528" font-size="24" font-weight="700" fill="#fcd34d" text-anchor="middle">실기 30제</text>
  </g>

  <!-- Bottom -->
  <text x="80" y="598" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" fill="#64748b">공무원·공공기관 종사자를 위한 시험 준비 플랫폼</text>
  <text x="1120" y="598" font-family="Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" fill="#475569" text-anchor="end">silmu.kr</text>
